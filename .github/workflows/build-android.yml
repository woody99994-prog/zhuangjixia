name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # 固定 ubuntu-24.04：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免构建环境漂移。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (inject API base)
        run: npm run build
        env:
          # 真实机联调用的「绝对」后端地址（原生壳内不走同源代理）。
          # 在仓库 Settings → Secrets and variables → Actions → Variables 里新建
          # VITE_API_BASE 即可覆盖下面的默认值（改地址无需改代码，推荐）。
          # 默认值 = 开发机内网 IP：手机需与电脑连同一 WiFi，且后端须绑 0.0.0.0。
          # 上线时改成公网域名，例如 https://api.yourdomain.com/api/app
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'http://192.168.8.10:3000/api/app' }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      # JDK 21 是硬要求：Capacitor 8 生成的 android/app/capacitor.build.gradle 里
      # 写死 sourceCompatibility/targetCompatibility = JavaVersion.VERSION_21。
      # 用 JDK 17 会在编译期直接报 "invalid source release: 21"。
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version 2>&1 | head -2
          sdkmanager --list_installed | head -20

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "===== gradle failed with exit $code ====="
            # 把日志尾部转成 GitHub 注解，便于在无权限下载日志时也能定位问题
            tail -n 40 gradle-build.log | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
